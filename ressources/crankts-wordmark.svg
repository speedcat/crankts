<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">CrankTS brush wordmark</title>
  <desc id="desc">Hand-painted CrankTS lettering with cream Crank, electric-blue TS, black brush contours, and a yellow acceleration swipe.</desc>

  <g id="yellow-brush-swipe" fill="#FFC13D">
